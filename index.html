<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xiaozi Graphics Development Team</title>
    <style>
        html{
            font-family: 微软雅黑;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-image: url('./day.jpg'); /* TODO: 替换浅色模式背景图片路径 */
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
            position: relative;
        }

        body.dark {
            background-image: url('./night.jpg'); /* TODO: 替换深色模式背景图片路径 */
        }

        /* 背景音频（隐藏） */
        #bgAudio {
            display: none;
        }

        body.dark h1 {
            color: #f1f5f9;
        }

        /* 右上角深色模式按钮 */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 140px;
            z-index: 1000;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 音频开关按钮 */
        .audio-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        body.dark .theme-toggle,
        body.dark .audio-toggle {
            background: #1e293b;
            border-color: #475569;
            color: #f1f5f9;
        }

        .theme-toggle:hover,
        .audio-toggle:hover {
            transform: scale(1.02);
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 32px;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 40px;
            transition: color 0.3s ease;

        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            position: relative;
            top: -50px;
            left: -300px;
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 500;
            border-radius: 40px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .btn-primary {
            background: #ca1dff;
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background: #1f557d;
        }

        .btn-secondary {
            background: white;
            color: #8722e6;
            border: 1px solid #cbd5e1;
        }

        body.dark .btn-secondary {
            background: #1e293b;
            color: #94a3b8;
            border-color: #475569;
        }

        body.dark .btn-secondary:hover {
            background: #334155;
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 32px;
            }
            .btn {
                padding: 10px 24px;
                font-size: 16px;
            }
            .theme-toggle,
            .audio-toggle {
                top: 12px;
                padding: 6px 12px;
                font-size: 12px;
                z-index: 1000;
            }
            
            .audio-toggle {
                right: 12px;
            }
            
            .theme-toggle {
                right: 80px;
            }
        }
        #div-h1 {
            position: relative;
            top: 60px;
            left: 590px;
            transform: translate(-50%, -50%);
            z-index: 100;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: white;
            z-index: 1;
            transition: background 0.3s ease;
            text-align: left;
        }
        h2 {
            font-size: 20px;
            margin: 0;
            padding-left: 50px;
            line-height: 80px;
            color: #1f557d;
            transition: color 0.3s ease;
        }

        body.dark h2 {
            color: #f1f5f9;
        }

        body.dark .top-bar {
            background: #1e293b;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <h2>xiaozi Graphics Development Team / 爱睡觉的白洲梓</h2>
    </div>
    <!-- 深色模式按钮 -->
    <button class="theme-toggle" id="themeToggle">
        🌙 深色模式
    </button>
    
    <!-- 音频开关按钮 -->
    <button class="audio-toggle" id="audioToggle">
        🔇 静音
    </button>
    
    <!-- 背景音频（隐藏） -->
    <audio id="bgAudio" loop>
        <source src="../2134.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <h1 id="div-h1">xiaozi Graphics Development Team / xiaozi craft</h1>
        <div class="buttons">
            <a href="https://www.curseforge.com/members/xiaozigraphics/projects" class="btn btn-primary">前往下载</a>
            <a href="https://366862732.github.io/xiaozi-craft-docs.github.io/user-guide/intro.html" class="btn btn-secondary">技术文档</a>
        </div>
    </div>

    <script>
        // 背景音频控制
        const bgAudio = document.getElementById('bgAudio');
        const audioToggle = document.getElementById('audioToggle');
        let isMuted = true;
        
        audioToggle.addEventListener('click', () => {
            if (isMuted) {
                bgAudio.play().catch(e => console.log('音频播放失败:', e));
                audioToggle.innerHTML = '🔊 有声音';
                isMuted = false;
            } else {
                bgAudio.pause();
                audioToggle.innerHTML = '🔇 静音';
                isMuted = true;
            }
        });

        // 深色模式按钮
        const toggle = document.getElementById('themeToggle');
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark');
            toggle.innerHTML = '☀️ 亮色模式';
        }

        toggle.addEventListener('click', () => {
            if (document.body.classList.contains('dark')) {
                document.body.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                toggle.innerHTML = '🌙 深色模式';
            } else {
                document.body.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                toggle.innerHTML = '☀️ 亮色模式';
            }
        });
    </script>
</body>
</html>
